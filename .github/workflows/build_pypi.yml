name: PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - develop
    tags:
      - "v**"
  release:
    types:
      - published

jobs:

  build-pip:
    name: Build pip
    runs-on: ubuntu-22.04
    container: python:3.11-slim-bullseye

    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          pip install virtualenv
          virtualenv venv
          . venv/bin/activate
          pip install build
      - name: Build WHL
        run: |
          . venv/bin/activate
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          path: ./dist/*.whl
          name: whl
  
  test-pip:
    name: Perform unit testing
    needs: [build-pip]
    runs-on: ubuntu-22.04
    container: python:3.11-slim-bullseye

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl gnupg
      - name: Install PyDFT
        run: |
          pip install virtualenv
          virtualenv venv
          . venv/bin/activate
          pip install build "coverage[toml]" pytest dist/*.whl
      - name: Perform unit tests
        run: |
          . venv/bin/activate
          python -m coverage run -m pytest tests/*.py --verbose
          python -m coverage report
          python -m coverage xml
      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
  
  upload_pypi:
    needs: [build-pip, test-pip]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
