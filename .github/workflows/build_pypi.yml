name: PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - develop
    tags:
      - "v**"
  release:
    types:
      - published

jobs:

  build-pip:
    name: Build pip
    runs-on: ubuntu-22.04
    container: python:3.11-slim-bookworm

    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          pip install virtualenv
          virtualenv venv
          . venv/bin/activate
          pip install build twine
      - name: Build release distributions
        run: |
          . venv/bin/activate
          python - <<'PYCODE'
          import os
          import runpy
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert runpy.run_path("pydft/_version.py")["__version__"] == version
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              assert ref.removeprefix("refs/tags/v") == version, "Tag/version mismatch"
          PYCODE
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          path: ./dist/*
          name: whl
  
  test-pip:
    name: Perform unit testing (Python ${{ matrix.python-version }})
    needs: [build-pip]
    runs-on: ubuntu-22.04
    container: python:${{ matrix.python-version }}-slim-bookworm
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Install coverage upload dependencies
        if: matrix.python-version == '3.11'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl gnupg
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist
      - name: Install PyDFT
        run: |
          pip install virtualenv
          virtualenv venv
          . venv/bin/activate
          pip install build "coverage[toml]" pytest dist/*.whl
      - name: Perform unit tests
        run: |
          . venv/bin/activate
          test_dir=$(mktemp -d)
          cp -r tests "$test_dir/tests"
          (
            cd "$test_dir"
            python - <<'PYCODE'
          from importlib.metadata import version
          from pathlib import Path
          import sys
          import pydft

          assert Path(pydft.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert pydft.__version__ == version("pydft")
          PYCODE
            python -m coverage run --parallel-mode \
              --rcfile "$GITHUB_WORKSPACE/pyproject.toml" \
              --data-file "$GITHUB_WORKSPACE/.coverage" \
              -m pytest tests --verbose --import-mode=importlib
          )
          python -m coverage combine
          python -m coverage report
          python -m coverage xml
      - name: Upload coverage report
        if: matrix.python-version == '3.11' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Skip Codecov upload
        if: matrix.python-version == '3.11' && env.CODECOV_TOKEN == ''
        run: |
          echo "::notice::Skipping Codecov upload because CODECOV_TOKEN is not configured."
  
  upload_pypi:
    needs: [build-pip, test-pip]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
