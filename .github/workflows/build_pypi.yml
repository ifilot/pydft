name: PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - develop
    tags:
      - "v**"
  release:
    types:
      - published

jobs:

  build-pip:
    name: Build pip
    runs-on: ubuntu-22.04
    container: python:3.11-slim-bookworm

    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          pip install virtualenv
          virtualenv venv
          . venv/bin/activate
          pip install build
      - name: Build WHL
        run: |
          . venv/bin/activate
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          path: ./dist/*.whl
          name: whl
  
  test-pip:
    name: Perform unit testing (Python ${{ matrix.python-version }})
    needs: [build-pip]
    runs-on: ubuntu-22.04
    container: python:${{ matrix.python-version }}-slim-bookworm
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Install coverage upload dependencies
        if: matrix.python-version == '3.11'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl gnupg
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist
      - name: Install PyDFT
        run: |
          pip install virtualenv
          virtualenv venv
          . venv/bin/activate
          pip install build "coverage[toml]" pytest dist/*.whl
      - name: Perform unit tests
        run: |
          . venv/bin/activate
          python -m coverage run -m pytest tests/*.py --verbose
          python -m coverage report
          python -m coverage xml
      - name: Upload coverage report
        if: matrix.python-version == '3.11' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Skip Codecov upload
        if: matrix.python-version == '3.11' && env.CODECOV_TOKEN == ''
        run: |
          echo "::notice::Skipping Codecov upload because CODECOV_TOKEN is not configured."
  
  upload_pypi:
    needs: [build-pip, test-pip]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
